name: Compilar instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Crear entorno aislado del sidecar
        shell: pwsh
        run: |
          python -m venv backend\.venv
          & backend\.venv\Scripts\python.exe -m pip install --upgrade pip
          & backend\.venv\Scripts\python.exe -m pip install -r backend\requirements.txt

      - name: Empaquetar sidecar Python
        shell: pwsh
        run: .\backend\build_sidecar.ps1

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar instaladores Tauri
        working-directory: frontend
        run: npm run tauri build

      - name: Publicar instaladores Windows
        uses: actions/upload-artifact@v4
        with:
          name: FajaControl-Windows-x64
          if-no-files-found: error
          retention-days: 90
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
